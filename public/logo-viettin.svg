<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="swooshBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="70%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Top Arc (Navy Swoosh) -->
    <path d="M 205 75 C 235 45, 305 30, 350 48 C 300 38, 230 52, 205 75 Z" fill="#0f2a4a" />
    
    <!-- Letter V (Navy Blue) -->
    <path d="M 155 75 L 180 75 L 205 135 L 230 75 L 255 75 L 215 160 C 210 170, 200 170, 195 160 Z" fill="#0f2a4a" />
    
    <!-- Letter T (Red) -->
    <path d="M 230 75 L 360 75 L 345 98 L 305 98 L 290 155 L 265 155 L 280 98 L 245 98 Z" fill="#c62828" />

    <!-- Bottom Arc (Silver to Red Swoosh) -->
    <path d="M 160 100 C 150 145, 175 190, 285 195 C 220 190, 165 165, 178 125 C 182 112, 195 105, 205 102 C 185 108, 165 125, 170 140 C 180 175, 245 190, 310 170 C 230 188, 170 170, 160 100 Z" fill="url(#swooshBottom)" />
  </g>

  <!-- Text: THÉP VIỆT TÍN -->
  <text x="250" y="240" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" fill="#0f2a4a" text-anchor="middle" letter-spacing="1">THÉP VIỆT TÍN</text>

  <!-- Slogan: — CHẤT LƯỢNG TẠO NIỀM TIN — -->
  <!-- Left Line -->
  <line x1="95" y1="268" x2="145" y2="268" stroke="#c62828" stroke-width="1.5" />
  <!-- Center Text -->
  <text x="250" y="272" font-family="'Montserrat', Arial, sans-serif" font-weight="800" font-size="14" fill="#0f2a4a" text-anchor="middle" letter-spacing="1.5">CHẤT LƯỢNG TẠO NIỀM TIN</text>
  <!-- Right Line -->
  <line x1="355" y1="268" x2="405" y2="268" stroke="#c62828" stroke-width="1.5" />
</svg>
