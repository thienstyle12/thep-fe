<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <g transform="translate(46, 120) scale(1.5)">
    <!-- Top Navy Swoosh Arc -->
    <path d="M 100 25 Q 170 -2 225 22" stroke="#16253b" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Letter V (Navy Blue) -->
    <path 
      d="M 68 28 L 108 108 L 144 28" 
      stroke="#16253b" 
      stroke-width="26" 
      stroke-linecap="square" 
      stroke-linejoin="miter"
      fill="none"
    />

    <!-- Letter T (Dark Red) -->
    <path 
      d="M 122 28 L 225 28 M 172 28 L 172 108" 
      stroke="#c9252b" 
      stroke-width="26" 
      stroke-linecap="square"
      fill="none"
    />

    <!-- Lower Grey Swoosh Curve -->
    <path d="M 52 58 Q 95 130 205 110" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Lower Red Swoosh Line -->
    <path d="M 85 92 Q 135 142 195 118" stroke="#c9252b" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Brand Name: THÉP VIỆT TÍN -->
    <text 
      x="140" 
      y="155" 
      text-anchor="middle" 
      fill="#16253b" 
      font-family="Arial, 'Helvetica Neue', sans-serif" 
      font-weight="900" 
      font-size="23" 
      letter-spacing="0.8"
    >THÉP VIỆT TÍN</text>
  </g>
</svg>
